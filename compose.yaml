services:
  app:
    build: .
    container_name: isp-manager-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    container_name: isp-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isp_manager}
      POSTGRES_USER: ${POSTGRES_USER:-isp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - isp_manager_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isp_app} -d ${POSTGRES_DB:-isp_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PostgreSQL is intentionally not published on the host network.
volumes:
  isp_manager_db:
